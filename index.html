<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Link++ — Connect with the world</title>

    <meta name="description" content="Link++ — Connect with the world. Make life better. Find every official Link++ channel in one place: GitHub, Twitter, Telegram, YouTube, Reddit, Medium, Facebook, WeChat, Weibo and Instagram."/>
    <meta name="keywords" content="LinkPlusPlus,linkplusplus,Link++,link-plus-plus,linkplus.plus,link,link+,link plus plus,linkpp"/>
    <meta name="theme-color" content="#101a2b"/>
    <meta name="color-scheme" content="dark"/>
    <link rel="canonical" href="https://linkplus.plus/"/>
    <link rel="icon" type="image/png" href="./image/favctor.png"/>

    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="Link++"/>
    <meta property="og:title" content="Link++ — Connect with the world"/>
    <meta property="og:description" content="Connect with the world. Make life better."/>
    <meta property="og:url" content="https://linkplus.plus/"/>
    <meta name="twitter:card" content="summary"/>
    <meta name="twitter:title" content="Link++ — Connect with the world"/>
    <meta name="twitter:description" content="Connect with the world. Make life better."/>
    <meta name="twitter:site" content="@LinkPlusPlus"/>
    <meta name="twitter:creator" content="@LinkPlusPlus"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"/>

    <style>
        :root {
            --bg: #101a2b;
            --line: rgba(255, 255, 255, 0.08);
            --text: #f1f4f8;
            --muted: #9db0c6;
            --faint: #6f8098;
            --accent: #c9d7e6;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(120deg, #101a2b 0%, #1a263a 100%);
            color: var(--text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(720px 480px at 14% 12%, rgba(255, 255, 255, 0.045), transparent 70%);
        }

        .shell {
            position: relative;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: clamp(36px, 7vh, 80px) clamp(22px, 5vw, 64px);
            flex: 1;
            display: grid;
            grid-template-columns: minmax(300px, 0.9fr) minmax(0, 1.1fr);
            gap: clamp(40px, 7vw, 104px);
            align-items: center;
        }

        /* ---------- Brand panel ---------- */

        .brand {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        h1 {
            margin: 0;
            font-size: clamp(3.5rem, 3.465vw + 1.351rem, 5.25rem);
            font-weight: 500;
            letter-spacing: 0;
            line-height: 1.1;
        }

        .slogan {
            margin: clamp(20px, 3vh, 28px) 0 0;
            font-size: clamp(1.05rem, 1.5vw, 1.3rem);
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1.4;
            color: var(--text);
        }

        /* ---------- Channels ---------- */

        .channels {
            width: 100%;
        }

        .list {
            display: flex;
            flex-direction: column;
        }

        .row {
            position: relative;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 24px;
            padding: 0 12px;
            margin: 0 -12px;
            height: 54px;
            color: var(--text);
            text-decoration: none;
            border-top: 1px solid var(--line);
            border-radius: 9px;
            transition: background 0.18s ease;
            animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
            animation-delay: calc(var(--i) * 32ms);
        }

        .row:last-child {
            border-bottom: 1px solid var(--line);
        }

        .row:hover {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.01) 70%, transparent);
        }

        .row:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            z-index: 1;
        }

        .name {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.005em;
        }

        .domain {
            font-size: 0.76rem;
            color: var(--faint);
            letter-spacing: 0.02em;
            transition: color 0.18s ease;
        }

        .row:hover .domain {
            color: var(--muted);
        }

        /* ---------- Dialog ---------- */

        dialog {
            width: min(340px, calc(100vw - 40px));
            padding: 28px 24px 24px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: #162a44;
            color: var(--text);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
            text-align: center;
        }

        dialog::backdrop {
            background: rgba(3, 5, 8, 0.74);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        dialog h2 {
            margin: 0 0 4px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        dialog p {
            margin: 0 0 20px;
            font-size: 0.8rem;
            color: var(--muted);
        }

        dialog img {
            display: block;
            width: 100%;
            max-width: 232px;
            height: auto;
            margin: 0 auto;
            border-radius: 12px;
            background: #fff;
        }

        .dialog-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
        }

        .dialog-close:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
        }

        .dialog-close:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- Responsive ---------- */

        @media (max-width: 880px) {
            .shell {
                grid-template-columns: 1fr;
                gap: clamp(38px, 6vh, 56px);
                align-items: start;
                padding-top: clamp(44px, 8vh, 72px);
                padding-bottom: 40px;
            }

            .brand {
                align-items: center;
                text-align: center;
            }
        }

        @media (max-width: 520px) {
            .row {
                gap: 16px;
                height: 52px;
                padding: 0 8px;
                margin: 0 -8px;
            }

            .domain {
                font-size: 0.7rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <aside class="brand">
        <h1>Link++</h1>
        <p class="slogan">Connect with the world.<br/>Make life better.</p>
    </aside>

    <main class="channels">
        <nav class="list" aria-label="Official Link++ channels">
            <a class="row" style="--i:0" href="https://github.com/linkplusplus" target="_blank" rel="noopener noreferrer">
                <span class="name">GitHub</span>
                <span class="domain">github.com</span>
            </a>

            <a class="row" style="--i:1" href="https://twitter.com/linkplusplus" target="_blank" rel="noopener noreferrer">
                <span class="name">Twitter</span>
                <span class="domain">twitter.com</span>
            </a>

            <a class="row" style="--i:2" href="https://t.me/linkplusplus" target="_blank" rel="noopener noreferrer">
                <span class="name">Telegram</span>
                <span class="domain">t.me</span>
            </a>

            <a class="row" style="--i:3" href="https://youtube.com/linkplusplus" target="_blank" rel="noopener noreferrer">
                <span class="name">YouTube</span>
                <span class="domain">youtube.com</span>
            </a>

            <a class="row" style="--i:4" href="https://www.reddit.com/r/linkplusplus/" target="_blank" rel="noopener noreferrer">
                <span class="name">Reddit</span>
                <span class="domain">reddit.com</span>
            </a>

            <a class="row" style="--i:5" href="https://medium.com/linkplusplus" target="_blank" rel="noopener noreferrer">
                <span class="name">Medium</span>
                <span class="domain">medium.com</span>
            </a>

            <a class="row" style="--i:6" href="https://facebook.com/linkplusplus" target="_blank" rel="noopener noreferrer">
                <span class="name">Facebook</span>
                <span class="domain">facebook.com</span>
            </a>

            <a class="row" style="--i:7" href="#" id="wechat-link">
                <span class="name">WeChat</span>
                <span class="domain">Scan QR code</span>
            </a>

            <a class="row" style="--i:8" href="https://weibo.com/linkplusplus" target="_blank" rel="noopener noreferrer">
                <span class="name">Weibo</span>
                <span class="domain">weibo.com</span>
            </a>

            <a class="row" style="--i:9" href="https://www.instagram.com/linkplusplus/" target="_blank" rel="noopener noreferrer">
                <span class="name">Instagram</span>
                <span class="domain">instagram.com</span>
            </a>
        </nav>
    </main>
</div>

<dialog id="wechat-dialog" aria-labelledby="wechat-title">
    <button class="dialog-close" type="button" aria-label="Close">&times;</button>
    <h2 id="wechat-title">WeChat</h2>
    <p>Scan the QR code to connect with us.</p>
    <img src="./image/wechat.jpg" alt="Link++ WeChat QR code" width="258" height="258" loading="lazy"/>
</dialog>

<script>
    (function () {
        var dialog = document.getElementById("wechat-dialog");
        var link = document.getElementById("wechat-link");
        var close = dialog.querySelector(".dialog-close");

        link.addEventListener("click", function (event) {
            event.preventDefault();
            if (typeof dialog.showModal === "function") {
                dialog.showModal();
            } else {
                window.open("./image/wechat.jpg", "_blank", "noopener");
            }
        });

        close.addEventListener("click", function () {
            dialog.close();
        });

        dialog.addEventListener("click", function (event) {
            if (event.target === dialog) {
                dialog.close();
            }
        });
    })();
</script>
</body>
</html>
